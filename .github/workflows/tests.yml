# The full test suite and the real app type-check, on every pull request.
#
# Why (2026-11-23): 18 tests had been failing on main, some for months, and
# nothing noticed — the only automatic check ran a hand-picked handful of
# files, and its type-check pointed at a config that checks no source files.
# Code merged and deployed with the suite red. The tests exist to catch a
# rewrite silently dropping a safeguard (the 60-minute session default was
# lost exactly that way); they only do that if a failure stops the merge.
#
# The whole suite is hermetic: it runs with env and file-read access only.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    name: edge function tests (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --no-check --no-lock --allow-env --allow-read supabase/functions/
      # Every edge function must at least LOAD. A stray character in a shared
      # file nothing in the test suite imports would otherwise pass the tests
      # and break the function at deploy (caught by hand, 2026-11-23).
      - run: deno cache --no-lock supabase/functions/*/index.ts

  app:
    name: app type-check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsconfig.json only references other configs and checks nothing by
      # itself; tsconfig.app.json is the one that covers src/.
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run test:calculators
      # EVERY MEMBER SCREEN IS OPENED, with realistic data, for every kind of
      # member (2026-11-25). A release crashed the program page for everyone
      # with an unwritten week; the type check, the build and every test above
      # passed, because none of them ever rendered a page. These do.
      - run: npm run test:pages
      # Nothing new may be used before it is declared: the exact mistake behind
      # that crash, which the type check does not catch.
      - run: npm run check:declared
      # The app must actually build.
      - run: npm run build
